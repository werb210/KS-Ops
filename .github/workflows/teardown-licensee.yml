name: Tear down licensee

# KS_OPS_AUTO_PROVISION_v1 - started by KS-Ops through the GitHub API (POST .../actions/workflows/teardown-licensee.yml/dispatches),
# never by hand in normal use. It does the GitHub steps of a brokerage's removal (its deploy/licensees.json entry and its ks-<code>
# environment in KS-Portal and KS-Client) and reports each step back to KS-Ops with the run's one-off callback token.
# See docs/PROVISIONING.md and docs/AUTO_PROVISIONING.md.
#
# KS_SHARED_HOSTING_v1 - no Azure sign-in any more: every brokerage runs on the shared apps made once by
# scripts/provision-shared.sh, and its database, role, registry entry and settings are KS-Ops service steps.
#
# Credentials (GitHub environment "ks-ops-teardown" of this repository - nothing is stored in KS-Ops):
#   variable  KS_PROVISION_APP_ID + secret KS_PROVISION_APP_PRIVATE_KEY  GitHub App for KS-Portal and KS-Client
#             (or secret KS_PROVISION_GH_TOKEN, a fine-grained token)
# Recommended: add a required reviewer to the ks-ops-teardown environment, so a person approves every removal.
# Anything missing is reported to KS-Ops ("waiting for manual setup") and nothing is changed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: KS-Ops provisioning run id
        required: true
        type: string
      code:
        description: The licensee's company code
        required: true
        type: string
      steps:
        description: Comma-separated steps to run
        required: true
        type: string
      ks_ops_url:
        description: KS-Ops address to report to
        required: true
        type: string
      callback_token:
        description: One-off token for this run (masked in the log)
        required: true
        type: string
      dry_run:
        description: Print the plan only
        required: false
        default: 'false'
        type: string

run-name: Tear down ${{ inputs.code }}${{ inputs.dry_run == 'true' && ' (dry run)' || '' }}

concurrency:
  group: ks-provision-${{ inputs.code }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-24.04
    environment: ks-ops-teardown
    timeout-minutes: 330
    steps:
      - name: Hide the callback token
        env:
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: echo "::add-mask::$CALLBACK_TOKEN"

      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: GitHub App token for the app repositories
        id: app
        if: vars.KS_PROVISION_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KS_PROVISION_APP_ID }}
          private-key: ${{ secrets.KS_PROVISION_APP_PRIVATE_KEY }}
          owner: werb210
          repositories: KS-Portal,KS-Client

      - id: runner
        name: Tear down (registry, GitHub environments)
        env:
          MODE: teardown
          RUN_ID: ${{ inputs.run_id }}
          STEPS: ${{ inputs.steps }}
          KS_OPS_URL: ${{ inputs.ks_ops_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_OWNER: werb210
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.KS_PROVISION_GH_TOKEN }}
        run: npx tsx src/provisioning/runner/main.ts

      # Something failed before the runner could start (checkout, npm ci): tell KS-Ops so it does not wait for hours.
      - name: Report a failure before the runner started
        if: failure() && steps.runner.outcome == 'skipped'
        env:
          RUN_ID: ${{ inputs.run_id }}
          STEPS: ${{ inputs.steps }}
          KS_OPS_URL: ${{ inputs.ks_ops_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          step="${STEPS%%,*}"
          curl -fsS -X POST "$KS_OPS_URL/api/provisioning/callback/$RUN_ID" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" -H "Content-Type: application/json" \
            -d "{\"step\":\"$step\",\"status\":\"failed\",\"message\":\"The workflow failed before it started: $LOG_URL\"}" || true
