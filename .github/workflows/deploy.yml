name: Deploy to Azure Web App

# Deploys only a main commit whose CI run passed, and exactly the commit CI tested.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ks-ops
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Build
        run: rm -rf dist && npm run build

      - name: Prune dev deps
        run: npm prune --omit=dev

      - name: Verify build
        run: test -f dist/index.js && test -f migrations/001_init.sql

      - name: Create deployment package
        run: zip -qr release.zip dist migrations node_modules package.json package-lock.json

      # Service principal from AZURE_CREDENTIALS; the target app comes from the AZURE_WEBAPP_NAME repository variable.
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME || 'ks-ops-dev' }}
          package: release.zip
